<style>
 body{margin:0;background:#fff}
 svg{display:block}
 .lbl{font:600 15px/1 "Noto Sans CJK TC",sans-serif;fill:#b45309;letter-spacing:.05em}
 .h{font:700 22px/1 "Noto Sans CJK TC",sans-serif;fill:#0f172a}
 .t{font:600 19px/1 "Noto Sans CJK TC",sans-serif;fill:#0f172a}
 .s{font:400 15px/1 "DejaVu Sans Mono","Noto Sans CJK TC",monospace;fill:#64748b}
 .n{font:400 14px/1 "Noto Sans CJK TC",sans-serif;fill:#94a3b8}
 .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:6}
 .grey{fill:#e2e8f0;stroke:#cbd5e1}
 .warm{fill:#fdebd8;stroke:#c2410c;stroke-width:2}
 .teal{fill:#e6f4f1;stroke:#0f766e;stroke-width:2}
 .par{fill:#fff;stroke:#64748b;stroke-width:2;stroke-dasharray:8 5;rx:6}
 .pt{font:700 18px/1 "Noto Sans CJK TC",sans-serif;fill:#334155}
 .ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
<svg width="1900" height="1230" viewBox="-100 0 1900 1230" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>

<text class="lbl" x="45" y="52">即時串流 · WS</text>
<text class="h"   x="45" y="92">邊講邊出字</text>
<text class="lbl" x="1000" y="52">整檔上傳 · HTTP</text>
<text class="h"   x="1000" y="92">錄完再處理</text>

<!-- 左欄:即時串流 -->
<rect class="box grey" x="45" y="150" width="685" height="82"/>
<text class="t" x="75" y="200">音訊 600ms 區塊進來</text>
<path class="ar" d="M387 232 L387 296"/>

<rect class="box" x="45" y="300" width="685" height="100"/>
<text class="t" x="75" y="338">Fun-ASR-Nano 逐字預覽</text>
<text class="s" x="75" y="370">每 720ms 重解整個視窗 · 中英夾雜也準</text>
<path class="ar" d="M387 400 L387 446"/>

<rect class="warm" x="45" y="450" width="685" height="100" rx="6"/>
<text class="t" x="75" y="492">fsmn-vad 依「停頓」斷句</text>
<text class="s" x="75" y="524">600ms 沒聲音就切一段</text>
<path class="ar" d="M387 550 L387 596"/>

<rect class="box" x="45" y="600" width="685" height="100"/>
<text class="t" x="75" y="642">音訊守門</text>
<text class="s" x="75" y="674">擋掉靜音與雜訊，避免模型幻覺</text>
<path class="ar" d="M387 700 L387 746"/>

<rect class="box" x="45" y="750" width="685" height="100"/>
<text class="t" x="75" y="792">Qwen3-ASR 定稿 → 繁體</text>
<text class="s" x="75" y="824">約 1 秒 · 預覽文字被正式文字覆蓋</text>
<path class="ar" d="M387 850 L387 896"/>

<rect class="teal" x="45" y="900" width="685" height="100" rx="6"/>
<text class="t" x="75" y="942">逐句寫入資料庫</text>
<text class="s" x="75" y="974">不等錄音結束 · 斷線也不遺失</text>

<!-- 併行分支:語者辨識吃的是音訊,不是資料庫 -->
<path d="M45 191 C -55 300, -55 900, 43 1090" stroke="#64748b" stroke-width="2"
      stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/>
<text class="n" x="-42" y="640" transform="rotate(-90 -42 640)" text-anchor="middle">同一份音訊</text>
<rect class="par" x="45" y="1040" width="685" height="122"/>
<text class="pt" x="75" y="1078">語者辨識（併行，不擋上面的流程）</text>
<text class="s"  x="75" y="1110">pyannote 吃同一份音訊，與逐字稿同時算</text>
<text class="s"  x="75" y="1142">約 15 秒後貼上標籤，之後持續回頭修正</text>

<!-- 右欄:整檔上傳 -->
<rect class="box grey" x="1000" y="150" width="685" height="82"/>
<text class="t" x="1030" y="188">音檔上傳</text>
<text class="s" x="1030" y="216">m4a / wav / mp3 · ffmpeg 解碼</text>
<path class="ar" d="M1342 232 L1342 296"/>

<rect class="box" x="1000" y="300" width="685" height="100"/>
<text class="t" x="1030" y="342">pyannote 全域語者分離</text>
<text class="s" x="1030" y="374">整份音訊在手 · 每 16ms 判定誰在說</text>
<path class="ar" d="M1342 400 L1342 446"/>

<rect class="warm" x="1000" y="450" width="685" height="100" rx="6"/>
<text class="t" x="1030" y="492">依「語者轉換」切段</text>
<text class="s" x="1030" y="524">每段天生只有一個人</text>
<path class="ar" d="M1342 550 L1342 596"/>

<rect class="box" x="1000" y="600" width="685" height="100"/>
<text class="t" x="1030" y="642">過長發言在最安靜處切開</text>
<text class="s" x="1030" y="674">上限 30 秒</text>
<path class="ar" d="M1342 700 L1342 746"/>

<rect class="box" x="1000" y="750" width="685" height="100"/>
<text class="t" x="1030" y="792">併發定稿 → 繁體</text>
<text class="s" x="1030" y="824">最多 8 段同時送 Qwen3-ASR</text>
<path class="ar" d="M1342 850 L1342 896"/>

<rect class="teal" x="1000" y="900" width="685" height="100" rx="6"/>
<text class="t" x="1030" y="942">寫入資料庫 + 建立向量索引</text>
<text class="s" x="1030" y="974">逐字稿與摘要都進向量庫</text>

<path d="M1685 500 C 1790 620, 1790 940, 1687 1090" stroke="#64748b" stroke-width="2"
      stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/>
<text class="n" x="1776" y="700" transform="rotate(90 1776 700)" text-anchor="middle">切段時已定案</text>
<rect class="par" x="1000" y="1040" width="685" height="122"/>
<text class="pt" x="1030" y="1078">語者辨識（切段時就完成）</text>
<text class="s"  x="1030" y="1110">每段天生只有一個人，標籤當下就確定</text>
<text class="s"  x="1030" y="1142">不需要事後回頭修正</text>

<!-- 關鍵差異 -->
<path d="M745 500 L985 500" stroke="#c2410c" stroke-width="2" stroke-dasharray="9 6" fill="none"/>
<rect x="800" y="462" width="130" height="30" fill="#fff"/>
<text class="lbl" x="808" y="484">關鍵差異</text>
</svg>
